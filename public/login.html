<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title>Event planner</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wrap">
    <a class="brand" href="/"><span class="brand-dot"></span>Event planner</a>
    <form class="card" id="login">
      <h1>Organizer login</h1>
      <p class="muted">Enter the master password to create events and see all of them.</p>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required autofocus>
      </div>
      <p class="error" id="error"></p>
      <button class="btn primary block big" type="submit">Continue</button>
    </form>
  </main>
  <script type="module">
    import { api, $ } from '/static/common.js';
    $('#login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.submitter;
      btn.disabled = true;
      try {
        await api('POST', '/api/login', { password: $('#password').value });
        location.reload();
      } catch (err) {
        $('#error').textContent = err.message;
        $('#password').select();
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
