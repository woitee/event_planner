<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title>New event</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wrap">
    <a class="brand" href="/"><span class="brand-dot"></span>Event planner</a>
    <form class="card" id="create">
      <p class="eyebrow">New event</p>
      <h1>What are we doing?</h1>
      <div class="stack" style="margin-top:22px">
        <div class="field">
          <label for="title">Name</label>
          <input id="title" name="title" placeholder="Board game night" maxlength="120" required>
        </div>
        <div class="row stack-sm">
          <div class="field">
            <label for="when">Starts</label>
            <input id="when" name="when" type="datetime-local">
          </div>
          <div class="field">
            <label for="end">Ends <span class="muted" style="font-weight:400">(optional)</span></label>
            <input id="end" name="end" type="datetime-local">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="min">At least</label>
            <div class="stepper">
              <button class="btn" type="button" data-step="-1" aria-label="Fewer">−</button>
              <input id="min" name="min" type="number" inputmode="numeric" min="1" max="200" value="4" required>
              <button class="btn" type="button" data-step="1" aria-label="More">+</button>
            </div>
          </div>
          <div class="field">
            <label for="max">At most</label>
            <div class="stepper">
              <button class="btn" type="button" data-step="-1" aria-label="Fewer">−</button>
              <input id="max" name="max" type="number" inputmode="numeric" min="1" max="200" placeholder="Any">
              <button class="btn" type="button" data-step="1" aria-label="More">+</button>
            </div>
          </div>
        </div>
        <p class="hint" style="margin-top:8px">It’s on once “at least” say yes. “At most” closes sign-ups; leave it empty for no limit.</p>
        <div class="field">
          <label for="where">Where</label>
          <input id="where" name="where" placeholder="My place" maxlength="200">
        </div>
        <div class="field">
          <label for="description">Note <span class="muted" style="font-weight:400">(optional)</span></label>
          <textarea id="description" name="description" placeholder="Bring snacks. We’re playing Wingspan." maxlength="2000"></textarea>
        </div>
      </div>
      <p class="error" id="error"></p>
      <button class="btn primary block big" type="submit">Create event</button>
    </form>

    <section class="card hidden" id="recent-card">
      <h2>Your events on this device</h2>
      <ul class="recent" id="recent"></ul>
    </section>
  </main>
  <script type="module" src="/static/create.js"></script>
</body>
</html>
